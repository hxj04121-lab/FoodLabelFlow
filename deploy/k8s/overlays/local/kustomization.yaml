# Local images only, never pulled: Colima's k3s shares the Docker daemon that built them, and
# on k3d scripts/s4-autoscale-demo.sh images runs `k3d image import`.
# Reach the UI and API only through kubectl port-forward on 127.0.0.1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
