spring:
  application:
    name: spectrace-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spectrace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:stage0-local-only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jdbc:
    template:
      query-timeout: 5s
server:
  port: ${SERVER_PORT:8080}
