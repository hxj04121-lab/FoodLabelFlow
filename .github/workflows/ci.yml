name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend with MySQL Testcontainers
        run: mvn -B -ntp -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build

  security:
    runs-on: ubuntu-latest
    if: ${{ vars.SECURITY_SCANS_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Calculate Dependency-Check cache key
        id: dependency-check-cache-key
        shell: bash
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Dependency-Check data cache
        id: dependency-check-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: OWASP Dependency-Check
        working-directory: backend
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          args=(
            -B
            -ntp
            org.owasp:dependency-check-maven:12.1.0:check
            -DfailBuildOnCVSS=7
            -DdataDirectory="$HOME/.cache/dependency-check"
          )

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::notice::NVD_API_KEY is not configured; using unauthenticated NVD API access."
          fi

          for attempt in 1 2; do
            if mvn "${args[@]}"; then
              exit 0
            fi

            if [[ "$attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Dependency-Check attempt $attempt failed; retrying once after 90 seconds."
            sleep 90
          done
      - name: Save Dependency-Check data cache
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}-${{ hashFiles('backend/pom.xml') }}
