name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**", "scrum-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend with MySQL Testcontainers
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/jacoco.xml
          if-no-files-found: error
      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Chromium for SCRUM-84 browser regressions
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify SCRUM-84 controlled identity switching and stale response isolation
        working-directory: frontend
        run: npx playwright test tests/scrum84-identity-switch.spec.ts tests/scrum84-returned-revision-ui.spec.ts --workers=1
      - name: Upload SCRUM-84 browser failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scrum84-identity-browser-evidence
          path: frontend/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start full stack
        run: docker compose up -d mysql backend frontend
      - name: Seed only released specification input for the S3 browser scenario
        shell: bash
        run: |
          set -euo pipefail
          fixture_input="$(mktemp)"
          sed '/^INSERT INTO formula_version/,$d' backend/src/test/resources/fixtures/s3-soy-spec-v2-adoption.sql > "$fixture_input"
          test -s "$fixture_input"
          if grep -Eiq 'INSERT INTO (formula_version|label_version|label_allergen_declaration|validation_run|review_task)' "$fixture_input"; then
            echo "The S3 input fixture must not seed business outputs."
            exit 1
          fi
          docker compose exec -T mysql sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" spectrace' < "$fixture_input"
      - name: Verify SCRUM-84 real demo identity switching against isolated stack
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LIVE_SCRUM84_IDENTITY: '1'
        run: npx playwright test tests/scrum84-identity-live.spec.ts --output=test-results/scrum84-live-identity
      - name: Verify the real read-only catalog and formula trace
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LIVE_CATALOG: '1'
          S3_EVIDENCE_DIR: test-results
        run: npx playwright test tests/catalog-live.spec.ts --output=test-results/catalog-browser
      - name: Seed a test-only compound creator in the isolated CI MySQL
        shell: bash
        run: |
          set -euo pipefail
          fixture_input=backend/src/test/resources/fixtures/s3-compound-maker.sql
          test -s "$fixture_input"
          if grep -Eiq '^[[:space:]]*(UPDATE|DELETE|ALTER|CREATE|GRANT|REVOKE|TRUNCATE|DROP|REPLACE)[[:space:]]|^[[:space:]]*INSERT[[:space:]]+INTO[[:space:]]+(role|permission|role_permission|label_version|label_allergen_declaration|validation_run|review_task|approval_record|publication_record|audit_event)[[:space:](]' "$fixture_input"; then
            echo "The compound fixture may add only its dedicated test user and user-role links."
            exit 1
          fi
          docker compose exec -T mysql sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" spectrace' < "$fixture_input"
      - name: Validate PASS and blocking FAIL through the browser before S3 adoptions
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LIVE_VALIDATION: '1'
          S3_EVIDENCE_DIR: test-results
        run: npx playwright test tests/validation-live.spec.ts --output=test-results/validation-browser
      - name: Reject compound-maker self-approval then publish twenty independent S3 labels
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LIVE_S3_FLOW: '1'
          S3_COMPOUND_MAKER_USER_ID: user_test_compound_maker_s3
          S3_COMPOUND_MAKER_SUBJECT: dev-external-test-compound-maker-s3
          S3_COMPOUND_MAKER_ALIAS_SUBJECT: DEV-EXTERNAL-TEST-COMPOUND-MAKER-S3
          S3_EVIDENCE_DIR: test-results
        run: npx playwright test tests/s3-product-flow-live.spec.ts --output=test-results/s3-browser
      - name: Verify real formula lifecycle after the S3 history proof is captured
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LIVE_WRITES: '1'
          S3_EVIDENCE_DIR: test-results
        run: npx playwright test tests/formula-lifecycle-fullstack.spec.ts --output=test-results/formula-browser
      - name: Show container logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color mysql backend frontend
      - name: Upload browser validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-browser-evidence
          path: frontend/test-results
          if-no-files-found: warn
      - name: Stop full stack
        if: always()
        run: docker compose down -v

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    # SonarCloud computes a quality gate only for main and pull requests.
    # Waiting on a short-lived branch push fails with a misleading
    # "Not authorized or project not found" error after a successful upload.
    if: ${{ vars.SONARQUBE_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile backend for analysis
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate frontend coverage from browser tests
        working-directory: frontend
        env:
          VITE_COVERAGE: 'true'
        run: |
          npx playwright install chromium
          npx playwright test --grep-invert 'captures.*live'
          npx nyc report --reporter=lcov --reporter=text-summary
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  security:
    runs-on: ubuntu-latest
    if: ${{ vars.SECURITY_SCANS_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Calculate Dependency-Check cache key
        id: dependency-check-cache-key
        shell: bash
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Dependency-Check data cache
        id: dependency-check-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: OWASP Dependency-Check
        working-directory: backend
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          args=(
            -B
            -ntp
            org.owasp:dependency-check-maven:12.1.0:check
            -DfailBuildOnCVSS=7
            -DdataDirectory="$HOME/.cache/dependency-check"
            # OSS Index rejects unauthenticated API reports (HTTP 401).
            # The NVD and CISA KEV analyzers remain enabled and enforce the gate.
            -DossindexAnalyzerEnabled=false
          )

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::notice::NVD_API_KEY is not configured; using unauthenticated NVD API access."
          fi

          for attempt in 1 2; do
            if mvn "${args[@]}"; then
              exit 0
            fi

            # A generated report means Dependency-Check completed its analysis
            # and found a policy failure. Retrying cannot remediate a CVE.
            if [[ -f target/dependency-check-report.html ]]; then
              exit 1
            fi

            if [[ "$attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Dependency-Check attempt $attempt failed; retrying once after 90 seconds."
            sleep 90
          done
      - name: Save Dependency-Check data cache
        if: ${{ always() && hashFiles('backend/target/dependency-check-report.html') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}-${{ hashFiles('backend/pom.xml') }}
